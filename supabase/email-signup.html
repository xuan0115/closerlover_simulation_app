<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>知己 Knowwo · 邮箱验证</title>
</head>
<body style="margin: 0; padding: 28px 8px; background-color: #f4f4f6; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'PingFang SC', 'Helvetica Neue', sans-serif; color: #111113; -webkit-font-smoothing: antialiased;">

  <!-- 外部居中容器 -->
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
    <tr>
      <td align="center">

        <!-- 经典 iPhone 4 黑色机身 -->
        <div style="width: 100%; max-width: 400px; background-color: #101012; border-radius: 50px; padding: 0 12px; border: 6px solid #c2c6cc; box-shadow: 0 0 0 1.5px #6e7278, 0 28px 70px rgba(0, 0, 0, 0.22); box-sizing: border-box; text-align: center;">


          <!-- 1. iPhone 4 经典额头（感光槽 + 前置镜头 + 听筒） -->
          <div style="padding: 22px 0 18px;">
            <!-- 距离感应器横槽 -->
            <div style="width: 32px; height: 5px; background-color: #050506; border-radius: 99px; margin: 0 auto 12px; border-bottom: 1px solid rgba(255,255,255,0.12);"></div>
            <!-- 镜头与听筒同行 -->
            <div style="display: inline-block; position: relative;">
              <span style="display: inline-block; width: 11px; height: 11px; border-radius: 50%; background-color: #1b2436; border: 1.5px solid #252529; vertical-align: middle; margin-right: 14px;"></span>
              <span style="display: inline-block; width: 58px; height: 8px; background-color: #18181b; border-radius: 99px; border: 1.5px solid #2c2c30; vertical-align: middle; margin-right: 25px;"></span>
            </div>
          </div>

          <!-- 2. 白色手机内屏幕（iPhone 4 的屏幕是 3:2；手机上邮件窄，内容排紧一点，比例才不会变得太长） -->
          <div style="background-color: #ffffff; min-height: 530px; border-radius: 4px; border: 2px solid #040405; overflow: hidden; text-align: center; box-sizing: border-box;">

            <!-- 屏幕顶部 iOS 状态栏（恢复第一版左侧绿点信号 + AM/PM时间 + 右侧绿色满电电池） -->
            <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color: #f7f7f9; border-bottom: 1px solid #ededf0; height: 28px; font-size: 11.5px; font-weight: 600; color: #111113;">
              <tr>
                <!-- 左上角：绿色小圆点 + Knowwo 5G -->
                <td align="left" style="padding-left: 14px; width: 35%; white-space: nowrap;">
                  <span style="display: inline-block; width: 6px; height: 6px; background-color: #10b981; border-radius: 50%; margin-right: 4px; vertical-align: middle;"></span>
                  <span style="vertical-align: middle;">Knowwo 5G</span>
                </td>

                <!-- 中间：带 AM/PM 的时间 -->
                <td align="center" style="width: 30%; white-space: nowrap;">9:41 AM</td>

                <!-- 右上角：100% + 绿色满电电池图标 -->
                <td align="right" style="padding-right: 14px; width: 35%; font-size: 11px; white-space: nowrap;">
                  <span style="vertical-align: middle; margin-right: 4px;">100%</span>
                  <span style="display: inline-block; vertical-align: middle; font-size: 0; line-height: 0;">
                    <span style="display: inline-block; width: 20px; height: 10px; border: 1.5px solid #111113; border-radius: 2px; padding: 1px; background-color: #ffffff; vertical-align: middle; box-sizing: border-box; text-align: left;">
                      <span style="display: block; width: 100%; height: 100%; background-color: #10b981; border-radius: 0.5px;"></span>
                    </span>
                    <span style="display: inline-block; width: 1.5px; height: 4px; background-color: #111113; border-radius: 0 1px 1px 0; vertical-align: middle; margin-left: 1px;"></span>
                  </span>
                </td>
              </tr>
            </table>

            <!-- 屏幕内邮件正文区（第一版原版字体大小与边距） -->
            <div style="padding: 26px 20px 22px; box-sizing: border-box;">

              <!-- 顶部品牌大字：知己 Knowwo（带右侧标志性绿色点） -->
              <div style="font-size: 28px; font-weight: 800; letter-spacing: -0.03em; color: #111113; line-height: 1.15;">
                知己 Knowwo<span style="display: inline-block; width: 7px; height: 7px; background-color: #10b981; border-radius: 50%; margin-left: 3px; vertical-align: baseline;"></span>
              </div>

              <!-- Slogan -->
              <div style="font-size: 12px; font-weight: 500; letter-spacing: 0.14em; color: #8e8e93; margin-top: 6px; text-transform: uppercase;">
                Be known, know yourself.
              </div>

              <!-- 顶部分割线 -->
              <div style="height: 1px; background-color: #ededf0; margin: 18px 0;"></div>

              <!-- 欢迎问候语 -->
              <div style="font-size: 17px; font-weight: 700; color: #111113; margin-bottom: 8px;">
                你好，欢迎来到知己。
              </div>
              <div style="font-size: 13.5px; color: #52525b; line-height: 1.65; margin-bottom: 16px;">
                很高兴在这里与你相遇。<br />
                请使用下方的验证码，<span style="white-space: nowrap;">打开专属你的知己小手机。</span>
              </div>

              <!-- 视觉中心：第一版浅灰底黑字验证码卡片 -->
              <div style="background-color: #f4f5f7; border: 1.5px solid #e4e4e7; border-radius: 16px; padding: 16px 12px 18px; margin-bottom: 14px;">
                <div style="font-size: 12px; font-weight: 600; color: #71717a; letter-spacing: 0.08em; margin-bottom: 8px;">
                  你的注册验证码
                </div>
                <div style="font-family: 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace; font-size: 36px; font-weight: 800; color: #111113; letter-spacing: 0.22em; padding-left: 0.22em; line-height: 1.1; user-select: all;">
                  {{ .Token }}
                </div>
              </div>

              <!-- 有效期提示 -->
              <div style="font-size: 13px; color: #52525b; line-height: 1.6;">
                验证码 <strong style="color: #111113;">10 分钟</strong>内有效，<span style="white-space: nowrap;">把它填回知己即可完成注册。</span>
              </div>

              <!-- 底部分割线 -->
              <div style="height: 1px; background-color: #ededf0; margin: 18px 0 14px;"></div>

              <!-- 底部安全提示与落款（两行独立拉开间距） -->
              <div style="font-size: 12px; color: #8e8e93; line-height: 1.6;">
                若非你本人操作，请忽略这封邮件。
              </div>
              <div style="font-size: 12px; color: #52525b; font-weight: 500; margin-top: 8px; letter-spacing: 0.02em;">
                祝你在这里找到知己，找到自己。
              </div>

            </div>
          </div>

          <!-- 3. iPhone 4 经典下巴与圆形 Home 键 -->
          <div style="padding: 18px 0 20px;">
            <div style="width: 52px; height: 52px; border-radius: 50%; background-color: #161619; border: 1.5px solid #3a3a40; margin: 0 auto; box-shadow: inset 0 2px 5px rgba(0,0,0,0.85);">
              <!-- Home 键中心圆角小方框 -->
              <div style="width: 16px; height: 16px; border: 1.6px solid rgba(255, 255, 255, 0.5); border-radius: 4px; margin: 16px auto 0;"></div>
            </div>
          </div>

        </div>

      </td>
    </tr>
  </table>

</body>
</html>
